services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # server-side only — the browser never calls this directly, the
      # Next app's /api/check route proxies to it over the compose network
      BACKEND_URL: http://api:8008
    depends_on:
      - api
    restart: unless-stopped
